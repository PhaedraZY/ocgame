<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>素材模板 · 换图用</title>
<link rel="stylesheet" href="https://npm.elemecdn.com/lxgw-wenkai-webfont@1.7.0/style.css">
<style>
  body { margin: 0; padding: 24px; font-family: "LXGW WenKai", sans-serif; background: #f3eee2; color: #5d5550; }
  h1 { font-size: 26px; margin: 0 0 6px; }
  .lead { max-width: 900px; line-height: 1.8; }
  .bar { position: sticky; top: 0; z-index: 2; display: flex; gap: 10px; align-items: center; padding: 10px 0; background: #f3eee2; }
  button { font: inherit; padding: 6px 14px; border: 1.6px solid #7a6c66; border-radius: 12px; background: #fffdf6; cursor: pointer; }
  button.main { background: #e3efc6; }
  h2 { margin: 26px 0 8px; font-size: 19px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
  .card { background: #fffdf6; border: 1.5px solid #d8cbbd; border-radius: 12px; padding: 10px; font-size: 13px; line-height: 1.5; }
  .card.has { border-color: #93bb57; box-shadow: 0 0 0 2px #e3efc6; }
  .card .pic { height: 120px; display: grid; place-items: center; margin-bottom: 6px; border-radius: 8px;
    background: repeating-conic-gradient(#eee8dc 0 25%, #fbf8f0 0 50%) 0 0 / 14px 14px; }
  .card canvas { max-width: 100%; max-height: 120px; }
  .card code { font-size: 12px; color: #6f9a3a; word-break: break-all; }
  .card small { color: #a39089; display: block; }
</style>
</head>
<body>
<h1>素材模板</h1>
<p class="lead">每张卡片是网页里一个可以换成你自己画的图的东西。下载模板（现在的手绘，已经是正确的尺寸，2 倍清晰度、透明底），在上面重画，<b>文件名保持不变</b>，放进 <code>theme/images/</code>，再把文件名加到 <code>theme/theme.json</code> 的 <code>"images"</code> 列表里，刷新网页就换好了。没换的东西会继续用手绘。绿框 = 主题包里已经有这张图。</p>
<div class="bar"><button class="main" id="zip">下载全部模板（zip）</button><span id="count"></span></div>
<div id="list"></div>
<script>window.BOOT_SCRIPTS = ['@sketch.js', '@skin.js', 'art.js', 'home-art.js', '@tools.js', '@templates.js'];</script>
<script src="../engine/boot.js?v=28"></script>
</body>
</html>
